<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FitBuddy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbf6;--card:#fff;--ink:#12352a;--mut:#6b8a7e;--g:#1fbf75;--gl:#d9f5e7;--y:#ffc93c;--c:#ff6b6b;--b:#5ab0ff;--line:#e2efe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f19;--card:#17302a;--ink:#e9f7f0;--mut:#8fb0a2;--gl:#1d4a38;--line:#24423a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1f19;--card:#17302a;--ink:#e9f7f0;--mut:#8fb0a2;--gl:#1d4a38;--line:#24423a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 Nunito,system-ui,sans-serif;padding-bottom:90px}
h1,h2,h3,.big{font-family:Fredoka,Nunito,sans-serif;margin:0;font-weight:600}
main{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header h1{font-size:26px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;border:2px solid var(--line)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:30px;line-height:1}
.bar{height:10px;border-radius:9px;background:var(--gl);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;border-radius:9px}
.btn{border:0;background:var(--g);color:#fff;font:800 15px Nunito,sans-serif;padding:11px 18px;border-radius:16px;cursor:pointer}
.btn.alt{background:var(--gl);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:12px}
.btn:focus-visible,.tab:focus-visible,.day:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.item button{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
.tab{flex:1;max-width:110px;border:0;background:none;color:var(--mut);font:800 12px Nunito,sans-serif;padding:6px;border-radius:14px;cursor:pointer}
.tab span{display:block;font-size:22px}
.tab.on{background:var(--gl);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal b{text-align:center;color:var(--mut);font-size:12px}
.day{aspect-ratio:1;border:2px solid var(--line);background:none;border-radius:14px;color:var(--ink);font:700 13px Nunito,sans-serif;cursor:pointer;display:grid;place-content:center;line-height:1.1;padding:0}
.day.gym{background:var(--g);border-color:var(--g);color:#fff}
.day.rest{background:var(--y);border-color:var(--y);color:#3a2d00}
.day.today{border-color:var(--ink)}
.day.empty{visibility:hidden}
.day{position:relative}
.day.sel{box-shadow:0 0 0 3px var(--b)}
.ex{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.exn{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0}
.exn b{font-weight:800;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exn span{text-align:right;font-size:12px}
.plus.sm2{width:24px;height:24px;font-size:15px}
.exn:focus-visible,.plus:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.day.log::after{content:"";position:absolute;bottom:4px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.week i{display:block;background:var(--b);border-radius:10px 10px 4px 4px;margin-bottom:4px;min-height:4px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:var(--gl)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
input,select{width:100%;font:700 15px Nunito,sans-serif;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food{width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:9px 4px;border-top:1px dashed var(--line);cursor:pointer;display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;z-index:20;display:none;max-width:90%;text-align:center}
#fig{position:fixed;right:6px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border:0;background:none;padding:0;cursor:pointer;z-index:6}
#fig svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
#bubble{position:fixed;right:78px;bottom:calc(104px + env(safe-area-inset-bottom,0px));max-width:min(220px,62vw);background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 4px 18px;padding:9px 13px;font-weight:800;font-size:13px;z-index:6;opacity:0;transform:scale(.9);transform-origin:bottom right;transition:.25s;pointer-events:none}
#bubble.show{opacity:1;transform:none}
.hr{animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.ml{padding:12px 0;border-top:2px solid var(--line)}.ml:first-of-type{border-top:0}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0 0 4px}
.plus{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--g);color:#fff;font:800 20px/1 Nunito,sans-serif;cursor:pointer}
.x{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 6px;font-size:15px}
.kbox{background:var(--gl);border-radius:12px;padding:4px 10px;font:600 15px Fredoka,Nunito,sans-serif;white-space:nowrap}.kbox.over{background:var(--c);color:#fff}
.burn{background:rgba(255,154,90,.13);border:2px solid rgba(255,154,90,.3);color:var(--ink);border-radius:20px;padding:12px;text-align:center;margin:12px 0 10px}.burn .big{font-size:32px}.burn span{font-size:13px;color:var(--mut)}
.sub{background:var(--bg);border-radius:16px;padding:10px 12px}.sub span,.sub small{display:block;font-size:12px;color:var(--mut)}.sub b{font:600 20px Fredoka,Nunito,sans-serif}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
#deco::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;display:none;border-radius:0 0 6px 6px}
.s-xmas #deco::before{display:block;background:repeating-linear-gradient(90deg,#ff5c5c 0 14px,#ffd84a 14px 28px,#5ab0ff 28px 42px,#1fbf75 42px 56px)}
.s-halloween #deco::before{display:block;background:repeating-linear-gradient(90deg,#f07f13 0 16px,#4b2a7a 16px 32px)}
.s-easter #deco::before{display:block;background:repeating-linear-gradient(90deg,#ffb3d1 0 16px,#fff3a0 16px 32px,#b5e8c9 32px 48px,#b9d9ff 48px 64px)}
.s-halloween{--g:#e8760c}
.pt{position:absolute;top:-30px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(300deg)}}
@media(prefers-reduced-motion:reduce){.pt{display:none}}
.hat{position:absolute;left:4px;top:-12px;width:60px;height:30px;pointer-events:none}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.stat+.stat{border-top:2px solid var(--line)}.stat b{font:600 20px Fredoka,Nunito,sans-serif}
.kc{text-align:center;margin:8px 0}.kc .big{font-size:44px}
.mbar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--gl);margin:6px 0 12px}.mbar i{display:block;height:100%}
.mt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mt3>div{background:var(--bg);border-radius:16px;padding:10px 6px;text-align:center}
.mt3 i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px}.mt3 b{display:block;font:600 19px Fredoka,Nunito,sans-serif}.mt3 span{font-size:12px;color:var(--mut)}
.mh{border:0;background:none;color:var(--ink);font:600 20px Fredoka,Nunito,sans-serif;padding:0;cursor:pointer;text-align:left}
@media(prefers-reduced-motion:reduce){.hr{animation:none}}
</style>

const Q=['Der Couch-Kartoffel-Modus ist heute offiziell deaktiviert! 🥔','Jeder Schritt zählt, auch der zum Kühlschrank. Aber nur einer!','Muskeln wachsen nicht von allein. Leider. 💪','Heute schwitzen, morgen strahlen ✨','Du musst nicht perfekt sein, nur dranbleiben.','Restday ist auch Training. Dein Sofa ist stolz auf dich 😴','Ein Salat hat noch nie jemanden gebissen. Probier ihn!','Kleine Gewohnheiten, große Wirkung. Los gehts!','Wasser trinken nicht vergessen! 💧','Dein zukünftiges Ich sagt Danke 🙌','Streak halten! Ich hab schon Schweißbänder gekauft.','Heute noch nicht gelaufen? Die Schuhe vermissen dich 👟','Fortschritt ist Fortschritt, auch wenn er langsam ist.','Eiweiß, Gemüse, gute Laune. Das Rezept des Tages!'];
let lastQ=-1;
function say(){let i;do{i=Math.floor(Math.random()*P().length)}while(i===lastQ);lastQ=i;const b=$('#bubble');b.textContent=P()[i];b.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>b.classList.remove('show'),7000)}
function mascotInit(){$('#fig').onclick=say;setTimeout(say,1500);setInterval(say,45000)}

// Smartwatch
function setHR(v){S.watch.hr=v;S.watch.sync=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});if(S.tab==='watch')render();else save()}
async function connect(){
 if(!navigator.bluetooth){toast('Dein Browser unterstützt kein Web-Bluetooth. Probier Chrome oder die Demo.');return}
 try{
  const dev=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
  const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService('heart_rate'),ch=await svc.getCharacteristic('heart_rate_measurement');
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;setHR(v.getUint8(0)&1?v.getUint16(1,true):v.getUint8(1))});
  dev.addEventListener('gattserverdisconnected',()=>{S.watch.on=false;S.watch.hr=null;render()});
  hrDev=dev;S.watch.on=true;S.watch.demo=false;render();toast('Verbunden ✅')
 }catch(e){toast('Verbindung klappt hier nicht. Ist die Uhr im Pulsmodus? Oder teste die Demo.')}}
function demo(){S.watch.on=true;S.watch.demo=true;S.watch.sleep='7 h 24 min';S.steps[T()]=Math.max(S.steps[T()]||0,6840);setHR(72);
 clearInterval(demoT);demoT=setInterval(()=>setHR(Math.round(68+Math.random()*14)),2000);toast('Demo läuft. Das sind Beispielwerte.')}
function disc(){clearInterval(demoT);try{hrDev&&hrDev.gatt.disconnect()}catch(e){}S.watch.on=false;S.watch.hr=null;render()}

$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};
if(S.watch.on&&S.watch.demo){demo()}else if(S.watch.on){S.watch.on=false;S.watch.hr=null}
applyDeco();render();mascotInit();
</script>
